<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111814">
<title>Las Yuntas · Visor 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101813;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none}
model-viewer{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(circle at 50% 42%,#1a2b21,#0d1511 72%);touch-action:none}
.brand{position:fixed;z-index:10;top:max(15px,env(safe-area-inset-top));left:18px;pointer-events:none;text-shadow:0 2px 8px #000}
.brand h1{margin:0;font-size:30px}.brand p{margin:3px 0 0;font-size:12px;opacity:.8;letter-spacing:.12em;text-transform:uppercase}
#loading{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:13px 17px;border-radius:14px;background:#000b}
#hint{position:fixed;z-index:10;left:50%;bottom:82px;transform:translateX(-50%);padding:9px 12px;border-radius:12px;background:#0009;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .5s}
.toolbar{position:fixed;z-index:15;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px;border:1px solid #ffffff24;border-radius:16px;background:#101813c7}
button{border:0;border-radius:11px;padding:11px 18px;min-height:44px;background:#ffffff20;color:#fff;font:600 14px system-ui}
</style>
</head>
<body>
<model-viewer id="viewer"
 src="las_yuntas.glb"
 alt="Modelo 3D de Las Yuntas"
 interaction-prompt="none"
 shadow-intensity="0.35"
 exposure="1"
 min-camera-orbit="auto 5deg 2%"
 max-camera-orbit="auto 89deg 800%">
</model-viewer>

<div class="brand"><h1>Las Yuntas</h1><p>Finca · Visor 3D</p></div>
<div id="loading">Cargando Las Yuntas…</div>
<div id="hint">1 dedo: mover · 2 dedos: zoom, inclinar y girar</div>
<div class="toolbar"><button id="home" type="button">⌂ Vista general</button></div>

<script>
const v=document.getElementById('viewer');
const loading=document.getElementById('loading');
const hint=document.getElementById('hint');

let theta=0, phi=55, radius=2.5;
let tx=0, ty=0, tz=0;
let home=null;
const pointers=new Map();
let prev1=null, prev2=null;

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const angleDiff=a=>Math.atan2(Math.sin(a),Math.cos(a));

function apply(){
  v.cameraOrbit=`${theta}rad ${phi}deg ${radius}m`;
  v.cameraTarget=`${tx}m ${ty}m ${tz}m`;
}
function two(){
  const a=[...pointers.values()];
  if(a.length<2)return null;
  const p=a[0],q=a[1], dx=q.x-p.x, dy=q.y-p.y;
  return {cx:(p.x+q.x)/2,cy:(p.y+q.y)/2,d:Math.max(1,Math.hypot(dx,dy)),a:Math.atan2(dy,dx)};
}

v.addEventListener('load',()=>{
  // Partimos EXACTAMENTE de la vista que model-viewer calcula bien para este GLB.
  const o=v.getCameraOrbit(), t=v.getCameraTarget();
  theta=o.theta; phi=o.phi*180/Math.PI; radius=o.radius;
  tx=t.x; ty=t.y; tz=t.z;
  home={theta,phi,radius,tx,ty,tz};
  apply();
  loading.style.display='none';
  setTimeout(()=>hint.style.opacity='0',6500);
});
v.addEventListener('error',e=>{
  console.error(e);
  loading.textContent='No se pudo cargar el modelo 3D.';
});

v.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  e.preventDefault();
  v.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){prev1={x:e.clientX,y:e.clientY};prev2=null}
  else if(pointers.size===2){prev2=two();prev1=null}
},{passive:false});

v.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'||!pointers.has(e.pointerId))return;
  e.preventDefault();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===1 && prev1){
    const p=[...pointers.values()][0];
    const dx=p.x-prev1.x, dy=p.y-prev1.y;

    // Un dedo = mover el punto de mira sobre el terreno, SIN rotar.
    // Escala proporcional a la distancia de cámara para que se sienta igual con cualquier zoom.
    const scale=radius/Math.max(innerHeight,400)*1.35;
    const st=Math.sin(theta), ct=Math.cos(theta);

    // derecha de pantalla y "arriba" de pantalla proyectados sobre el suelo XZ
    tx += (-dx*ct + dy*st)*scale;
    tz += ( dx*st + dy*ct)*scale;
    apply();
    prev1={...p};
  }

  if(pointers.size===2){
    const cur=two();
    if(prev2){
      // Pinza: zoom
      radius=clamp(radius*(prev2.d/cur.d), home.radius*.025, home.radius*8);

      // Giro de los dos dedos: rumbo
      theta -= angleDiff(cur.a-prev2.a);

      // Dos dedos paralelos arriba/abajo: inclinación
      phi=clamp(phi+(cur.cy-prev2.cy)*0.22,5,89);

      apply();
    }
    prev2=cur;
  }
},{passive:false});

function end(e){
  if(e.pointerType==='mouse')return;
  pointers.delete(e.pointerId);
  if(pointers.size===1){const p=[...pointers.values()][0];prev1={...p};prev2=null}
  else if(pointers.size===2){prev2=two();prev1=null}
  else{prev1=null;prev2=null}
}
v.addEventListener('pointerup',end,{passive:false});
v.addEventListener('pointercancel',end,{passive:false});

document.getElementById('home').addEventListener('click',()=>{
  if(!home)return;
  ({theta,phi,radius,tx,ty,tz}=home);
  apply();
});

// Escritorio: mantenemos manejo sencillo sin afectar al móvil.
v.addEventListener('wheel',e=>{
  e.preventDefault();
  if(!home)return;
  radius=clamp(radius*Math.exp(e.deltaY*.001),home.radius*.025,home.radius*8);
  apply();
},{passive:false});
</script>
</body>
</html>
