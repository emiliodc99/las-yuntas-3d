<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111814">
<title>Las Yuntas · Visor 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111814;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:fixed;z-index:10;top:max(14px,env(safe-area-inset-top));left:16px;pointer-events:none;text-shadow:0 2px 8px #000}
.brand h1{margin:0;font-size:28px;font-weight:650}.brand p{margin:2px 0 0;font-size:12px;opacity:.82;letter-spacing:.12em;text-transform:uppercase}
.hint{position:fixed;z-index:10;left:50%;bottom:82px;transform:translateX(-50%);padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.52);font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .5s}
.loading{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border-radius:14px;background:rgba(0,0,0,.72);text-align:center}
.progress{width:180px;height:4px;background:#ffffff2c;border-radius:99px;margin-top:9px;overflow:hidden}.bar{height:100%;width:0;background:white}
.toolbar{position:fixed;z-index:15;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px;background:rgba(12,18,14,.72);border:1px solid #ffffff26;border-radius:16px;backdrop-filter:blur(12px)}
button{border:0;border-radius:11px;padding:11px 18px;min-height:44px;background:#ffffff1f;color:#fff;font:600 14px system-ui}
</style>
</head>
<body>
<div id="scene"></div>
<div class="brand"><h1>Las Yuntas</h1><p>Finca · Visor 3D</p></div>
<div class="hint" id="hint">1 dedo: mover · 2 dedos: zoom, inclinar y girar</div>
<div class="loading" id="loading">Cargando Las Yuntas…<div class="progress"><div class="bar" id="bar"></div></div></div>
<div class="toolbar"><button id="home" type="button">⌂ Vista general</button></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';

const host=document.getElementById('scene');
const loading=document.getElementById('loading');
const bar=document.getElementById('bar');
const hint=document.getElementById('hint');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111814);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526057,2.5));
const sun=new THREE.DirectionalLight(0xffffff,2.1);
sun.position.set(3,5,4); scene.add(sun);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.enablePan=true;
controls.screenSpacePanning=false;
controls.zoomToCursor=true;
controls.minPolarAngle=.06;
controls.maxPolarAngle=Math.PI/2-.025;

// En móvil desactivamos los gestos propios de OrbitControls:
// los interpretamos nosotros para copiar el comportamiento de Google Maps/Earth.
controls.touches.ONE=THREE.TOUCH.NONE;
controls.touches.TWO=THREE.TOUCH.NONE;

let radius=1;
let homePos=new THREE.Vector3(), homeTarget=new THREE.Vector3();

const draco=new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/');
const gltfLoader=new GLTFLoader();
gltfLoader.setDRACOLoader(draco);

gltfLoader.load('las_yuntas.glb',gltf=>{
  const model=gltf.scene;
  scene.add(model);
  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  radius=Math.max(size.x,size.y,size.z);

  controls.target.copy(center);
  camera.position.set(center.x+radius*.70,center.y+radius*.95,center.z+radius*.70);
  camera.near=Math.max(radius/10000,.01);
  camera.far=Math.max(radius*100,1000);
  camera.updateProjectionMatrix();
  controls.minDistance=Math.max(radius*.02,.05);
  controls.maxDistance=radius*8;
  controls.update();

  homePos.copy(camera.position);
  homeTarget.copy(controls.target);
  loading.style.display='none';
  setTimeout(()=>hint.style.opacity='0',6500);
},xhr=>{
  if(xhr.total) bar.style.width=Math.round(xhr.loaded/xhr.total*100)+'%';
},err=>{
  console.error(err);
  loading.innerHTML='No se pudo cargar el modelo 3D.';
});

// ---------- GESTOS TIPO GOOGLE MAPS ----------
const el=renderer.domElement;
const pts=new Map();
let prevOne=null;
let prevTwo=null;

function twoState(){
  const a=[...pts.values()];
  if(a.length<2)return null;
  const p=a[0],q=a[1];
  const dx=q.x-p.x,dy=q.y-p.y;
  return {
    cx:(p.x+q.x)/2, cy:(p.y+q.y)/2,
    dist:Math.max(1,Math.hypot(dx,dy)),
    ang:Math.atan2(dy,dx)
  };
}
function normAngle(a){
  while(a>Math.PI)a-=Math.PI*2;
  while(a<-Math.PI)a+=Math.PI*2;
  return a;
}
function spherical(){
  const off=camera.position.clone().sub(controls.target);
  return new THREE.Spherical().setFromVector3(off);
}
function applySpherical(s){
  s.phi=THREE.MathUtils.clamp(s.phi,controls.minPolarAngle,controls.maxPolarAngle);
  s.radius=THREE.MathUtils.clamp(s.radius,controls.minDistance,controls.maxDistance);
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
  camera.lookAt(controls.target);
}

el.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse') return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    const p=[...pts.values()][0]; prevOne={...p}; prevTwo=null;
  } else if(pts.size===2){
    prevTwo=twoState(); prevOne=null;
  }
},{passive:false});

el.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'||!pts.has(e.pointerId))return;
  e.preventDefault();
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pts.size===1 && prevOne){
    const p=[...pts.values()][0];
    const dx=p.x-prevOne.x, dy=p.y-prevOne.y;

    // 1 dedo: desplazamiento sobre el plano del terreno, sin rotar cámara.
    const distance=camera.position.distanceTo(controls.target);
    const worldPerPixel=2*distance*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))/innerHeight;

    const right=new THREE.Vector3();
    camera.getWorldDirection(right);
    const forward=right.clone(); forward.y=0;
    if(forward.lengthSq()<1e-8) forward.set(0,0,-1);
    forward.normalize();
    right.crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

    const move=new THREE.Vector3()
      .addScaledVector(right,-dx*worldPerPixel)
      .addScaledVector(forward,dy*worldPerPixel);

    camera.position.add(move);
    controls.target.add(move);
    prevOne={...p};
  }

  if(pts.size===2){
    const cur=twoState();
    if(prevTwo){
      let s=spherical();

      // Separar/juntar = zoom.
      s.radius*=prevTwo.dist/cur.dist;

      // Girar físicamente los dos dedos = giro horizontal del modelo/cámara.
      s.theta-=normAngle(cur.ang-prevTwo.ang);

      // Mover LOS DOS dedos juntos arriba/abajo = inclinación 3D.
      const dy=cur.cy-prevTwo.cy;
      s.phi+=dy*0.006;

      applySpherical(s);
    }
    prevTwo=cur;
  }
},{passive:false});

function endPointer(e){
  if(e.pointerType==='mouse')return;
  pts.delete(e.pointerId);
  if(pts.size===1){
    const p=[...pts.values()][0]; prevOne={...p}; prevTwo=null;
  }else if(pts.size===2){
    prevTwo=twoState(); prevOne=null;
  }else{
    prevOne=null; prevTwo=null;
  }
}
el.addEventListener('pointerup',endPointer,{passive:false});
el.addEventListener('pointercancel',endPointer,{passive:false});
el.addEventListener('contextmenu',e=>e.preventDefault());

document.getElementById('home').onclick=()=>{
  camera.position.copy(homePos);
  controls.target.copy(homeTarget);
  controls.update();
};

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

renderer.setAnimationLoop(()=>{
  controls.update();
  renderer.render(scene,camera);
});
</script>
</body>
</html>
