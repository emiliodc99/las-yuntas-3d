<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111814">
  <title>Las Yuntas · Visor 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box} html,body{margin:0;height:100%;background:#111814;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    .app{height:100%;position:relative;background:radial-gradient(circle at 50% 30%,#29372e 0,#111814 65%)}
    model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent;touch-action:none;overscroll-behavior:none}
    .brand{position:absolute;z-index:5;top:max(16px,env(safe-area-inset-top));left:18px;pointer-events:none;text-shadow:0 2px 8px #000}
    .brand h1{margin:0;font-size:clamp(24px,5vw,42px);font-weight:650;letter-spacing:.03em}.brand p{margin:3px 0 0;font-size:13px;opacity:.82;letter-spacing:.12em;text-transform:uppercase}
    .toolbar{position:absolute;z-index:6;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:7px;background:rgba(12,18,14,.72);border:1px solid rgba(255,255,255,.15);border-radius:16px;backdrop-filter:blur(12px);white-space:nowrap}
    button{appearance:none;border:0;border-radius:11px;padding:11px 14px;background:rgba(255,255,255,.12);color:#fff;font:600 14px system-ui;cursor:pointer;min-height:44px}button:hover{background:rgba(255,255,255,.2)}button:active{transform:scale(.98)}
    .hint{position:absolute;z-index:4;right:14px;top:max(18px,env(safe-area-inset-top));max-width:190px;padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.38);font-size:12px;line-height:1.35;backdrop-filter:blur(8px);opacity:.9;transition:opacity .5s}
    .loading{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.65);font-size:14px;pointer-events:none}
    .progress{width:170px;height:4px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:8px;overflow:hidden}.bar{height:100%;width:0;background:#fff;transition:width .15s}
    @media(max-width:600px){.hint{top:auto;bottom:82px;right:12px;max-width:165px}.toolbar{width:calc(100% - 24px);justify-content:center}.toolbar button{flex:1;padding:10px 8px}.brand h1{font-size:28px}}
  </style>
</head>
<body>
<div class="app">
  <div class="brand"><h1>Las Yuntas</h1><p>Finca · Visor 3D</p></div>
  <div class="hint" id="hint">1 dedo: gira · 2 dedos: desplaza y zoom</div>
  <div class="loading" id="loading">Cargando Las Yuntas…<div class="progress"><div class="bar" id="bar"></div></div></div>
  <model-viewer id="viewer" src="las_yuntas.glb" alt="Modelo tridimensional de la finca Las Yuntas" camera-controls touch-action="none" disable-tap shadow-intensity="0.7" exposure="1.05" environment-image="neutral" interaction-prompt="auto" min-camera-orbit="auto 0deg 0.1%" max-camera-orbit="auto 180deg 5000%" interpolation-decay="80" orbit-sensitivity="1"></model-viewer>
  <div class="toolbar">
    <button id="home" type="button">⌂ Vista general</button>
    <button id="spin" type="button">⟳ Giro automático: no</button>
  </div>
</div>
<script>
  const v=document.getElementById('viewer'), loading=document.getElementById('loading'), bar=document.getElementById('bar'), hint=document.getElementById('hint'), spin=document.getElementById('spin');
  v.addEventListener('progress',e=>{bar.style.width=Math.round(e.detail.totalProgress*100)+'%'});
  v.addEventListener('load',()=>{loading.style.display='none'; v.cameraControls=true; setTimeout(()=>hint.style.opacity='0',8000)});
   // En móvil: el visor captura los gestos para que la página no se desplace.
   ['touchstart','touchmove'].forEach(type=>v.addEventListener(type,e=>{ if(e.cancelable)e.preventDefault(); },{passive:false}));
  v.addEventListener('error',()=>{loading.innerHTML='No se pudo cargar el modelo.<br><small>Abre este visor desde un servidor web.</small>'});
  document.getElementById('home').addEventListener('click',()=>{v.cameraOrbit='auto auto auto';v.cameraTarget='auto auto auto';v.fieldOfView='auto';v.jumpCameraToGoal()});
  spin.addEventListener('click',()=>{v.autoRotate=!v.autoRotate;spin.textContent=v.autoRotate?'⟳ Giro automático: sí':'⟳ Giro automático: no'});
</script>
</body>
</html>
