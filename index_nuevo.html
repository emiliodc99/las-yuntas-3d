<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111814">
<title>Las Yuntas · Visor 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111814;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:fixed;z-index:10;top:max(16px,env(safe-area-inset-top));left:18px;pointer-events:none;text-shadow:0 2px 8px #000}
.brand h1{margin:0;font-size:clamp(26px,6vw,42px);font-weight:650}.brand p{margin:3px 0 0;font-size:13px;opacity:.82;letter-spacing:.12em;text-transform:uppercase}
.hint{position:fixed;z-index:10;left:50%;bottom:90px;transform:translateX(-50%);padding:9px 13px;border-radius:12px;background:rgba(0,0,0,.48);font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .5s}
.loading{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border-radius:14px;background:rgba(0,0,0,.7);text-align:center}
.progress{width:180px;height:4px;background:#ffffff2c;border-radius:99px;margin-top:9px;overflow:hidden}.bar{height:100%;width:0;background:white}
.toolbar{position:fixed;z-index:15;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px;background:rgba(12,18,14,.72);border:1px solid #ffffff26;border-radius:16px;backdrop-filter:blur(12px)}
button{border:0;border-radius:11px;padding:11px 18px;min-height:44px;background:#ffffff1f;color:#fff;font:600 14px system-ui}
</style>
</head>
<body>
<div id="scene"></div>
<div class="brand"><h1>Las Yuntas</h1><p>Finca · Visor 3D</p></div>
<div class="hint" id="hint">1 dedo: desplazar · 2 dedos: acercar, alejar y girar</div>
<div class="loading" id="loading">Cargando Las Yuntas…<div class="progress"><div class="bar" id="bar"></div></div></div>
<div class="toolbar"><button id="home">⌂ Vista general</button></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MapControls} from 'three/addons/controls/MapControls.js';

const host=document.getElementById('scene'), loading=document.getElementById('loading'), bar=document.getElementById('bar'), hint=document.getElementById('hint');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111814);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526057,2.4));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(3,5,4); scene.add(sun);

const controls=new MapControls(camera,renderer.domElement);
controls.touches.ONE=THREE.TOUCH.PAN;
controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.screenSpacePanning=true;
controls.zoomToCursor=true;
controls.panSpeed=1.15;
controls.rotateSpeed=.7;
controls.zoomSpeed=1;
controls.minPolarAngle=.04;
controls.maxPolarAngle=Math.PI/2-.02;

let homePos=new THREE.Vector3(), homeTarget=new THREE.Vector3();

new GLTFLoader().load('las_yuntas.glb',gltf=>{
 const model=gltf.scene; scene.add(model);
 const box=new THREE.Box3().setFromObject(model);
 const center=box.getCenter(new THREE.Vector3());
 const size=box.getSize(new THREE.Vector3());
 const r=Math.max(size.x,size.y,size.z);
 controls.target.copy(center);
 camera.position.set(center.x+r*.72,center.y+r*.92,center.z+r*.72);
 camera.near=Math.max(r/10000,.01); camera.far=Math.max(r*100,1000); camera.updateProjectionMatrix();
 controls.minDistance=Math.max(r*.025,.05); controls.maxDistance=r*8; controls.update();
 homePos.copy(camera.position); homeTarget.copy(controls.target);
 loading.style.display='none'; setTimeout(()=>hint.style.opacity='0',7000);
},xhr=>{if(xhr.total)bar.style.width=Math.round(xhr.loaded/xhr.total*100)+'%'},()=>{loading.innerHTML='No se pudo cargar el modelo 3D.'});

document.getElementById('home').onclick=()=>{camera.position.copy(homePos);controls.target.copy(homeTarget);controls.update()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
